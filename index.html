<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Conteúdo Exclusivo — Confirme seu acesso</title>
  <meta name="description" content="Responda para continuar e acessar o conteúdo exclusivo."/>
  <meta name="robots" content="noindex, nofollow"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Inter',-apple-system,sans-serif;
      background:#faf8f5;
      min-height:100vh;
      display:flex;align-items:center;justify-content:center;
      padding:20px;
    }
    .screen{display:none;width:100%;max-width:460px;animation:fadeIn .3s ease}
    .screen.active{display:block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .card{
      background:#fff;border-radius:20px;
      box-shadow:0 8px 40px rgba(0,0,0,.08);
      padding:44px 36px 36px;
      text-align:center;
    }
    .progress-wrap{margin-bottom:28px}
    .progress-label{font-size:11px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
    .progress-bar{height:4px;background:#f0ede8;border-radius:999px;overflow:hidden}
    .progress-fill{height:100%;background:#F05A28;border-radius:999px;transition:width .4s ease}
    .quiz-step{font-size:11px;font-weight:700;color:#F05A28;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
    .quiz-title{font-size:20px;font-weight:800;color:#1a1a1a;line-height:1.35;margin-bottom:8px}
    .quiz-sub{font-size:13px;color:#6b7280;margin-bottom:28px;line-height:1.6}
    .options{display:flex;flex-direction:column;gap:10px}
    .opt{
      background:#fafafa;border:1.5px solid #ede8e2;
      border-radius:12px;padding:14px 18px;
      font-size:14px;font-weight:600;color:#1a1a1a;
      cursor:pointer;text-align:left;
      transition:border-color .18s,background .18s,transform .15s;
      display:flex;align-items:center;gap:12px;
    }
    .opt:hover{border-color:#F05A28;background:#fff5f2;transform:translateX(4px)}
    .opt:active{transform:scale(.98)}
    .opt-icon{
      width:34px;height:34px;border-radius:50%;
      background:#fff0eb;border:1.5px solid #f0b89a;
      display:flex;align-items:center;justify-content:center;
      font-size:16px;flex-shrink:0;
    }
    .age-icon{font-size:42px;margin-bottom:16px}
    .age-logo{
      display:flex;align-items:center;justify-content:center;
      margin-bottom:20px;
    }
    .card-title{font-size:22px;font-weight:800;color:#1a1a1a;margin-bottom:12px}
    .card-desc{font-size:14px;color:#6b7280;line-height:1.75;margin-bottom:30px}
    .btn-laranja{
      display:block;width:100%;
      background:#F05A28;color:#fff;
      border:none;border-radius:12px;
      padding:18px;font-size:16px;font-weight:700;
      cursor:pointer;font-family:inherit;
      transition:background .18s,transform .18s,box-shadow .18s;
      box-shadow:0 4px 18px rgba(240,90,40,.30);
      position:relative;overflow:hidden;
      margin-bottom:12px;
    }
    .btn-laranja::before{
      content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
      animation:shine 2.5s ease-in-out infinite;
    }
    @keyframes shine{0%{left:-100%}50%,100%{left:160%}}
    .btn-laranja:hover{background:#e5521f;transform:translateY(-2px);box-shadow:0 8px 24px rgba(240,90,40,.42)}
    .btn-laranja:active{transform:scale(.98)}
    .btn-sair{font-size:13px;color:#9ca3af;cursor:pointer;transition:color .15s;display:block;text-align:center;background:none;border:none;font-family:inherit;width:100%}
    .btn-sair:hover{color:#6b7280}
    .seguro-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#9ca3af;margin-top:16px;}
  </style>
</head>
<body>

  <!-- TELA 1 — QUIZ -->
  <div class="screen active" id="tela-1">
    <div class="card">
      <div class="progress-wrap">
        <div class="progress-label">Pergunta 1 de 1</div>
        <div class="progress-bar"><div class="progress-fill" style="width:50%"></div></div>
      </div>
      <div class="quiz-step">Passo 1</div>
      <div class="quiz-title">Você já assinou alguma plataforma de conteúdo exclusivo?</div>
      <div class="quiz-sub">Selecione uma opção para continuar</div>
      <div class="options">
        <button class="opt" onclick="avancar(2)"><div class="opt-icon">✅</div> Sim, já assinei</button>
        <button class="opt" onclick="avancar(2)"><div class="opt-icon">🆕</div> Não, é minha primeira vez</button>
        <button class="opt" onclick="avancar(2)"><div class="opt-icon">🤔</div> Estou pensando em assinar</button>
      </div>
    </div>
  </div>

  <!-- TELA 2 — CONFIRMAÇÃO DE IDADE -->
  <div class="screen" id="tela-2">
    <div class="card">

      <div class="age-logo">
        <img src="images/logo-laranja.png" alt="Privacy" style="height:60px;width:auto">
      </div>

      <div class="age-icon">🔞</div>
      <div class="card-title">Confirmação de Idade</div>
      <div class="card-desc">
        Este conteúdo é destinado exclusivamente para maiores de 18 anos.
        Por favor, confirme sua idade para continuar.
      </div>

      <a id="cta-link" href="https://privacybadvi.vercel.app" style="text-decoration:none">
        <button class="btn-laranja">✅ Tenho mais de 18 anos — Entrar</button>
          </a>

      <button class="btn-sair" onclick="window.location.href='https://google.com'">
        Não tenho 18 anos — sair
      </button>

      <div class="seguro-badge">
        <svg width="12" height="12" fill="none" stroke="#9ca3af" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Acesso seguro e discreto
      </div>

    </div>
  </div>

<script>
  function avancar(tela) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('tela-' + tela).classList.add('active');
    window.scrollTo({top:0, behavior:'smooth'});
  }

  // Captura UTMs da URL
  const params = window.location.search;

  // Adiciona UTMs ao botão
  const cta = document.getElementById('cta-link');

  if (cta && params) {
    cta.href += params;
  }
</script>
</body>
</html>
